name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run formatter
        run: pnpm run format:check

      - name: Run linter
        run: pnpm run lint

      - name: Check types
        run: pnpm tsc

      - name: Run build
        run: pnpm run build

  # Matrix data for both matrix jobs below. scripts/ci-matrix.mjs is the
  # single source of truth (also imported by the local runner: `pnpm run
  # test:ci`), so the workflow and local legs cannot drift apart.
  matrix-data:
    name: Matrix data
    runs-on: ubuntu-latest
    outputs:
      cluster-images: ${{ steps.emit.outputs.cluster-images }}
      client-matrix: ${{ steps.emit.outputs.client-matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Emit matrix JSON
        id: emit
        run: node scripts/ci-matrix.mjs --emit >> "$GITHUB_OUTPUT"

  test-no-cluster:
    name: Test (no cluster)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # Redis-free projects only; every redis-backed project runs in the
      # cluster-matrix job below (including against the newest image).
      - name: Run tests
        run: pnpm run test:no-cluster

  cluster-matrix:
    name: Cluster (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [checks, matrix-data]
    strategy:
      fail-fast: false
      # Entries come from scripts/ci-matrix.mjs via the matrix-data job.
      matrix:
        image: ${{ fromJSON(needs.matrix-data.outputs.cluster-images) }}
    env:
      REDIS_IMAGE: ${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # Only the redis-backed projects vary by server image: the two cluster
      # projects plus the lib smoke test (which exercises the built bundle
      # against redis). The local/memory/light projects are covered by `test`,
      # which runs the full suite against the default (newest) matrix image.
      - name: Run cluster tests
        run: pnpm run test:cluster && pnpm run test:lib

  client-matrix:
    name: Clients (${{ matrix.project }}@${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [checks, matrix-data]
    strategy:
      fail-fast: false
      # Include entries ({client, version, project, image}) come from
      # scripts/ci-matrix.mjs via the matrix-data job.
      matrix: ${{ fromJSON(needs.matrix-data.outputs.client-matrix) }}
    env:
      REDIS_IMAGE: ${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # Overrides the devDependency after the normal install. Nothing is
      # committed, so mutating package.json here is safe; every pinned major
      # is admitted by the peer ranges, so pnpm won't warn about conflicts.
      - name: Pin client version
        run: pnpm add -D ${{ matrix.client }}@${{ matrix.version }}

      - name: Run cluster tests
        run: pnpm exec vitest run --project ${{ matrix.project }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [test-no-cluster, cluster-matrix, client-matrix]
    if: always()
    steps:
      - name: Require all test jobs to pass
        run: |
          test_no_cluster_result="${{ needs.test-no-cluster.result }}"
          cluster_matrix_result="${{ needs.cluster-matrix.result }}"
          client_matrix_result="${{ needs.client-matrix.result }}"
          failed=0
          for r in "$test_no_cluster_result" "$cluster_matrix_result" "$client_matrix_result"; do
            if [[ "$r" != "success" ]]; then
              failed=1
            fi
          done
          echo "test-no-cluster: $test_no_cluster_result"
          echo "cluster-matrix: $cluster_matrix_result"
          echo "client-matrix: $client_matrix_result"
          if [[ "$failed" == "1" ]]; then
            echo "::error::One or more test jobs failed."
            exit 1
          fi
