name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run formatter
        run: pnpm run format:check

      - name: Run linter
        run: pnpm run lint

      - name: Check types
        run: pnpm tsc

      - name: Run build
        run: pnpm run build

  test-no-cluster:
    name: Test (no cluster)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      # Redis-free projects only; every redis-backed project runs in the
      # cluster-matrix job below (including against the newest image).
      - name: Run tests
        run: pnpm run test:no-cluster

  cluster-matrix:
    name: Cluster (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        image:
          - redis:6-alpine
          - redis:7-alpine
          - valkey/valkey:8-alpine
          - valkey/valkey:9-alpine
    env:
      REDIS_IMAGE: ${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      # Only the redis-backed projects vary by server image: the two cluster
      # projects plus the lib smoke test (which exercises the built bundle
      # against redis). The local/memory/light projects are covered by `test`,
      # which runs the full suite against the default (newest) matrix image.
      - name: Run cluster tests
        run: pnpm run test:cluster && pnpm run test:lib

  # Varies the CLIENT library versions; each vitest project uses exactly one
  # client, so each leg overrides a single devDependency and runs only the
  # matching project — no cross-product legs. Old clients are paired with the
  # oldest supported server (the realistic combination: apps pin old clients
  # against managed Redis that lags). New clients × every server image are
  # covered by cluster-matrix via the committed lockfile.
  client-matrix:
    name: Clients (${{ matrix.project }}@${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { client: ioredis, version: 5, project: ioredis, image: redis:6-alpine }
          - { client: redis, version: 4, project: node-redis, image: redis:6-alpine }
          - { client: redis, version: 5, project: node-redis, image: redis:6-alpine }
    env:
      REDIS_IMAGE: ${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      # Overrides the devDependency after the normal install. Nothing is
      # committed, so mutating package.json here is safe; every pinned major
      # is admitted by the peer ranges, so pnpm won't warn about conflicts.
      - name: Pin client version
        run: pnpm add -D ${{ matrix.client }}@${{ matrix.version }}

      - name: Run cluster tests
        run: pnpm exec vitest run --project ${{ matrix.project }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [test-no-cluster, cluster-matrix, client-matrix]
    if: always()
    steps:
      - name: Require all test jobs to pass
        run: |
          test_no_cluster_result="${{ needs.test-no-cluster.result }}"
          cluster_matrix_result="${{ needs.cluster-matrix.result }}"
          client_matrix_result="${{ needs.client-matrix.result }}"
          failed=0
          for r in "$test_no_cluster_result" "$cluster_matrix_result" "$client_matrix_result"; do
            if [[ "$r" != "success" ]]; then
              failed=1
            fi
          done
          echo "test-no-cluster: $test_no_cluster_result"
          echo "cluster-matrix: $cluster_matrix_result"
          echo "client-matrix: $client_matrix_result"
          if [[ "$failed" == "1" ]]; then
            echo "::error::One or more test jobs failed."
            exit 1
          fi
