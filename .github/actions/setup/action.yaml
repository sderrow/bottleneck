name: Setup
description: Set up Node.js with pnpm & install dependencies with cache.

# Note: actions/checkout is NOT in this composite — local composite actions
# can't run before the repo is checked out, so callers must check out first
# and then `uses: ./.github/actions/setup`.

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v2
      with:
        cache: true
